[project]
name = "agent-review-lab"
version = "0.1.0"
description = "Reference LangGraph and Strands Agents implementations for a fictional fuel logistics company, used as a code-review lab."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.20",
    "langgraph-checkpoint==4.3.1",
    "strands-agents[anthropic]==1.64.0",
    "anthropic==0.125.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "python-dotenv==1.2.4",
]

[project.scripts]
demo = "northwind.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-timeout==2.4.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northwind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "ASYNC", # flake8-async
    "TRY",   # tryceratops
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie
    "PL",    # pylint
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "ARG",   # flake8-unused-arguments
]
ignore = [
    "PLR0913", # agent tool signatures legitimately take several arguments
    "PLR2004", # domain thresholds live in config; literals in tests are fine
    "TRY003",  # descriptive exception messages are preferred here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "PLR0915"]
"src/northwind/cli.py" = ["T201"]
# Overrides of the Strands Model interface must keep its full signature.
"src/northwind/llm/strands_models.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["northwind"]
